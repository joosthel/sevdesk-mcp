name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and attach the .mcpb bundle
  id-token: write # npm provenance + MCP registry OIDC login

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Tokenless: requires npm Trusted Publishing configured for this package
      # (npmjs.com → sevdesk-mcp → Settings → Trusted Publishing:
      # repository joosthel/sevdesk-mcp, workflow release.yml).
      # Skips when the version is already on npm so re-runs stay idempotent.
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "sevdesk-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "sevdesk-mcp@${VERSION} is already on npm — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish to the MCP registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Pack the MCPB bundle
        run: |
          npm prune --omit=dev
          npx --yes @anthropic-ai/mcpb pack . sevdesk-mcp.mcpb

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" sevdesk-mcp.mcpb \
            --title "sevdesk-mcp ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md — https://github.com/joosthel/sevdesk-mcp/blob/main/CHANGELOG.md"
